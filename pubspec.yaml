name: astrosophy
description: A local-first astronomy companion for amateur astrophotography.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.3.7
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  image: ^4.5.3
  image_picker: ^1.1.2
  # 历史记录的路径拼接。path_provider 会间接带上它，但直接 import 的包
  # 必须在 pubspec 里显式声明，否则换个依赖版本就可能解析不到。
  path: ^1.9.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/astrosophy_app_icon.svg
    - assets/brand/astrosophy_app_icon.png
    - assets/brand/astrosophy_app_icon_recraft.svg
    # 引导页吉祥物。SVG 是 Recraft 出的矢量源稿，PNG 是用无头浏览器栅格化
    # 之后 APP 真正加载的那张，见 tools/make_mascot.py。
    - assets/brand/astrosophy_mascot.png
    - assets/brand/astrosophy_mascot.svg
    # 内置亮星目录，由 tools/build_catalog.py 离线生成，供本机解算使用。
    - assets/catalog/stars.json
    - assets/catalog/names.json
    - assets/catalog/constellations.json
    - assets/catalog/constellation_grid.bin
    # 自带的演示星图。原图底部的相机信息条（设备、时间、拍摄地点）已裁掉，
    # 见 lib/demo.dart。
    - assets/demo/demo_m31.jpg
    - assets/demo/demo_m45.jpg
    - assets/demo/demo_vesta.jpg
