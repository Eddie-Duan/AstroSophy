name: astrosophy
description: A local-first astronomy companion for amateur astrophotography.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.3.7
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  image: ^4.5.3
  image_picker: ^1.1.2
  # 历史记录的路径拼接。path_provider 会间接带上它，但直接 import 的包
  # 必须在 pubspec 里显式声明，否则换个依赖版本就可能解析不到。
  path: ^1.9.0
  path_provider: ^2.1.5
  # 「导出带标注的图」走系统分享面板，用户自己选存到相册、存到文件、还是发出去。
  # 不用「写进某某目录然后告诉他路径」那种做法：那个目录在手机的文件管理器里
  # 一层层点进去才能找到，等于没下载。
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/astrosophy_app_icon.svg
    - assets/brand/astrosophy_app_icon.png
    - assets/brand/astrosophy_app_icon_recraft.svg
    # 引导页插画（四页各一张），由 tools/make_onboarding_art.py 用 Recraft 生成。
    # 只有 PNG 进安装包——SVG 是无头浏览器栅格化之前的矢量源稿，留在仓库里只为
    # 日后重新导出别的尺寸。
    - assets/brand/astrosophy_mascot.png
    - assets/brand/astrosophy_mascot.svg
    - assets/brand/astrosophy_onboarding_local.png
    - assets/brand/astrosophy_onboarding_result.png
    - assets/brand/astrosophy_onboarding_keep.png
    # 内置亮星目录，由 tools/build_catalog.py 离线生成，供本机解算使用。
    - assets/catalog/stars.json
    - assets/catalog/names.json
    - assets/catalog/constellations.json
    - assets/catalog/constellation_grid.bin
    # Gaia DR3 补充层：Hipparcos 够不着的天区（星点稀、视场又不大）靠它凑够
    # 目录星。定长 7 字节一条，见 tools/build_catalog.py 的 pack_gaia_star。
    - assets/catalog/gaia.bin
    # 星表的元信息（深度、各层星数、来源）。分层的界线从这里读，不写死在代码里。
    - assets/catalog/catalog_meta.json
    # 内置深空目录（Messier 110 + 亮 NGC/IC），供本机解算标名字用。
    - assets/catalog/deepsky.json
    # 自带的演示星图。原图底部的相机信息条（设备、时间、拍摄地点）已裁掉，
    # 见 lib/demo.dart。
    - assets/demo/demo_m31.jpg
    - assets/demo/demo_m45.jpg
    - assets/demo/demo_vesta.jpg
    - assets/demo/demo_saturn.jpg
    - assets/demo/demo_moon.jpg
