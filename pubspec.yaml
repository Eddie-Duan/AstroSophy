name: astrosophy
description: A local-first astronomy companion for amateur astrophotography.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.3.7
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  image: ^4.5.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/astrosophy_app_icon.svg
    - assets/brand/astrosophy_app_icon.png
    - assets/brand/astrosophy_app_icon_recraft.svg
