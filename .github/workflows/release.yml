name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check that the tag matches the pubspec version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -n1 | cut -d+ -f1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the pubspec version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Write the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ASTROSOPHY_KEYSTORE_BASE64 }}
        run: |
          # 缺凭据就直接失败，不退到 debug 签名。理由：debug keystore 是每个
          # runner 现生成的，用它签出来的包签名每次都不一样，用户装上就得先
          # 卸载——API Key 和观星仓库一起没。宁可这一次不发版，也不能发出一个
          # 会清空用户数据的包。怎么配见 docs/TECHNICAL.md。
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ASTROSOPHY_KEYSTORE_BASE64 is not set. A release signed with the runner's throwaway debug key cannot be installed over the previous one, and uninstalling wipes the user's API key and observation log. See docs/TECHNICAL.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/astrosophy-release.jks
      - run: flutter build apk --release
        env:
          ASTROSOPHY_STORE_FILE: astrosophy-release.jks
          ASTROSOPHY_STORE_PASSWORD: ${{ secrets.ASTROSOPHY_STORE_PASSWORD }}
          ASTROSOPHY_KEY_ALIAS: ${{ secrets.ASTROSOPHY_KEY_ALIAS }}
          ASTROSOPHY_KEY_PASSWORD: ${{ secrets.ASTROSOPHY_KEY_PASSWORD }}
      - name: Collect the APK
        run: |
          # 产物交给用户时叫 AstroSophy.apk。`flutter build apk` 写出来的是
          # app-release.apk，而 Gradle 那边已经改不动它了（AGP 8 废弃了
          # archivesBaseName，变体 API 给的只是只读的 Provider<Directory>），
          # 所以改名落在这里。
          mkdir -p dist
          if [ -f build/app/outputs/flutter-apk/AstroSophy.apk ]; then
            src=build/app/outputs/flutter-apk/AstroSophy.apk
          else
            src=build/app/outputs/flutter-apk/app-release.apk
          fi
          cp "$src" dist/AstroSophy.apk
          ls -l dist
      - name: Take the changelog entry for this version
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            rm release-notes.md
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          if [ -f release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "AstroSophy $VERSION" \
            "${notes[@]}" \
            "dist/AstroSophy.apk"
